name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 変換結果を実際の kanata で構文チェックする
      - name: Download kanata
        run: |
          curl -sSL -o kanata.zip https://github.com/jtroo/kanata/releases/download/v1.10.1/kanata-linux-binaries-v1.10.1-x64.zip
          unzip -q kanata.zip -d kanata-bin
          chmod +x kanata-bin/kanata_linux_x64
          echo "KANATA_BIN=$PWD/kanata-bin/kanata_linux_x64" >> "$GITHUB_ENV"

      - name: Run tests
        run: npm test

  # kanata-switcher (タスクトレイ常駐ツール) を実際の Windows PowerShell 5.1 で検証
  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: kanata-switcher tests (Windows PowerShell 5.1)
        shell: powershell
        run: .\test\windows\kanata-switcher.tests.ps1

      - name: WinForms / アイコン生成の読み込み確認
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap 32, 32
          [System.Drawing.Icon]::FromHandle($bmp.GetHicon()) | Out-Null
          New-Object System.Windows.Forms.NotifyIcon | Out-Null
          Get-CimInstance -ClassName Win32_PnPEntity -Filter "DeviceID LIKE '%VID%PID%'" | Select-Object -First 3 Name, DeviceID, PNPClass
