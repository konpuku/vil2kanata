<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>vil2kanata GUI - キーマップエディタ</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ヘッダー -->
  <header class="header">
    <span class="header-title">vil2kanata</span>
    <nav class="view-tabs">
      <button class="view-tab view-tab-active" data-view="mapping">① 対応付け</button>
      <button class="view-tab" data-view="keymap">② キーマップ編集</button>
    </nav>
    <span id="status-summary" class="status-summary"></span>
    <div class="header-controls">
      <button id="btn-export-kbd" class="btn-primary" title=".kbd ファイルをダウンロード">.kbd エクスポート</button>
      <button id="btn-save-project" title="プロジェクトを JSON で保存">保存</button>
      <button id="btn-load-project" title="保存したプロジェクトを読み込み (旧形式も可)">読込</button>
      <button id="btn-new-project" title="新規作成">新規</button>
    </div>
  </header>

  <!-- 非表示のファイル入力 -->
  <input type="file" id="file-input-vil" class="hidden" accept=".vil,.json,.c,.h" multiple>
  <input type="file" id="file-input-extras" class="hidden" accept=".json,.c,.h" multiple>
  <input type="file" id="file-input-project" class="hidden" accept=".json">

  <div class="main-container">

    <!-- サイドパネル -->
    <div id="defsrc-panel" class="defsrc-panel">
      <button id="btn-import-vil" class="defsrc-btn" title=".vil を読み込む (vial.json / keymap.c / config.h も同時に選択可)">.vil 読み込み</button>
      <div class="defsrc-section-label">キー表示</div>
      <div class="defsrc-btn-row">
        <button id="btn-label-us" class="defsrc-btn defsrc-btn-sm">US</button>
        <button id="btn-label-jis" class="defsrc-btn defsrc-btn-sm defsrc-btn-active">JIS</button>
      </div>

      <div class="defsrc-divider"></div>
      <button id="btn-layout-edit" class="defsrc-btn" title="ノートPCのキーの追加・削除・キー名変更">ノートPC配列を編集</button>
      <div id="layout-edit-panel" style="display:none; flex-direction:column; gap:6px;">
        <div class="defsrc-section-label">キー追加</div>
        <input type="text" id="new-key-kanata" placeholder="kanata キー名 例: henk" class="defsrc-input">
        <input type="text" id="new-key-label" placeholder="ラベル (省略可)" class="defsrc-input">
        <div class="defsrc-edit-row">
          <label class="defsrc-mini-label">段:</label>
          <select id="new-key-row" class="defsrc-select-sm"></select>
        </div>
        <div class="defsrc-edit-row">
          <label class="defsrc-mini-label">幅:</label>
          <input type="number" id="new-key-width" value="1" min="0.5" max="7" step="0.25" class="defsrc-input-num">
        </div>
        <button id="btn-add-layout-key" class="defsrc-btn">＋ 追加</button>
      </div>

      <div class="defsrc-divider"></div>
      <div id="defsrc-hint" class="defsrc-hint"></div>
    </div>

    <!-- コンテンツ -->
    <div class="content-area">
      <div class="keyboard-area">
        <div class="keyboard-pane">
          <div class="keyboard-pane-label" id="target-keyboard-label">ノートPC</div>
          <div id="keyboard-container"></div>
        </div>
        <div class="keyboard-pane" id="vil-keyboard-pane" style="display:none">
          <div class="keyboard-pane-label" id="vil-keyboard-label">自作キーボード</div>
          <div id="vil-keyboard-container"></div>
        </div>
      </div>

      <div class="bottom-area">
        <!-- ① 対応付けウィザード -->
        <div id="mapping-panel" class="mapping-panel"></div>

        <!-- ② キーマップ編集 -->
        <div id="keymap-area" style="display:none">
          <div class="layer-tabs-container" id="layer-tabs"></div>
          <div class="feature-tabs-container" id="feature-tabs"></div>
          <div id="editor-panel"></div>
          <div id="feature-panel" style="display:none"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="bundle.js"></script>
</body>
</html>
